api:
  replicaCount: 3
  image:
    repository: lab3-api
    tag: v3
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"
  healthFail: false             # переменная HEALTH_FAIL для api
  extraLabels:
    team: shop

worker:
  replicaCount: 2
  image:
    repository: lab3-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"
  extraLabels:
    team: shop

postgres:
  instances: 1
  storage:
    size: 1Gi
  extraLabels:
    team: shop

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true