apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: default
  labels:
    app: bad
    team: qa
spec:
  containers:
    - name: c
      image: nginx:1.27
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
        requests:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        privileged: true