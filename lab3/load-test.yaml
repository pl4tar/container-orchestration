apiVersion: v1
kind: Pod
metadata:
  name: load-test
  namespace: shop
  labels:
    app: load-test
    team: shop
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 600); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://shop-api/health)
            echo "$(date +%T) req=$i code=$code"
            sleep 0.2
          done