# Один процесс делает всё: приём, хранение, запросы.
deploymentMode: Monolithic

loki:
  # Без мультитенантности: иначе каждый запрос требует заголовок X-Scope-OrgID.
  auth_enabled: false
  commonConfig:
    # Одна копия данных. По умолчанию 3 — с одним подом Loki отказался бы принимать записи.
    replication_factor: 1
  storage:
    # Чанки и индекс лежат на диске пода, без S3.
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    size: 5Gi

# Остальные режимы развёртывания выключены.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Обвязка для больших инсталляций, в лабе только ест ресурсы.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false