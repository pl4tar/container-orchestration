ipam:
  mode: kubernetes

kubeProxyReplacement: "false"

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Включаем Hubble для наблюдаемости (понадобится в части 6)
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enable:
      - drop
      - tcp
      - dns

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    # Если бы prom-values.yaml не имел serviceMonitorSelectorNilUsesHelmValues: false,
    # нам бы понадобилась метка release: kube-prom. Но у тебя false, так что и так подхватится.