{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    # по этой метке sidecar Grafana находит ConfigMap и кладёт JSON в provisioning
    grafana_dashboard: "1"
data:
  shop-mesh.json: |-
    {{- .Files.Get "dashboards/shop-mesh.json" | nindent 4 }}
{{- end }}