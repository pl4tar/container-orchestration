{{- if .Values.api.trafficSplit.enabled }}
# Клиенты по-прежнему ходят в shop-api: parentRef на Service говорит прокси клиента
# делить такие запросы между версиями. Веса дальше меняет скрипт-гейт.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: core
      kind: Service
      name: {{ .Release.Name }}-api
      port: {{ .Values.api.service.port }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-api-v1
          port: {{ .Values.api.service.port }}
          weight: {{ sub 100 (int .Values.api.trafficSplit.v2Weight) }}
        - name: {{ .Release.Name }}-api-v2
          port: {{ .Values.api.service.port }}
          weight: {{ .Values.api.trafficSplit.v2Weight }}
{{- end }}
