apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    {{- include "shop.labels" . | nindent 4 }}
  {{- if and .Values.api.mesh.enabled .Values.api.mesh.retries.enabled }}
  annotations:
    retry.linkerd.io/http: {{ .Values.api.mesh.retries.http | quote }}
    retry.linkerd.io/limit: {{ .Values.api.mesh.retries.limit | quote }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  selector:
    {{- include "shop.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}