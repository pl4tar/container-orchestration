priorityClasses:
  - name: shop-critical
    value: 100000
    preemptionPolicy: PreemptLowerPriority
    description: "Критический путь заказа: api, postgres"
  - name: shop-batch
    value: -10
    preemptionPolicy: Never
    description: "Фоновая аналитика, жертвуем первой"

api:
  replicaCount: 3
  image:
    repository: lab4-api
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  priorityClassName: shop-critical
  resources:
    requests:
      cpu: "250m"
      memory: "100Mi"
    limits:
      cpu: "250m"
      memory: "100Mi"
  pdb:
    enabled: true
    maxUnavailable: 1
  healthFail: false            
  extraLabels:
    team: shop
  spread:
    mode: topologySpread
    topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule 
    antiAffinityType: preferred
  

worker:
  replicaCount: 2
  image:
    repository: lab4-worker
    tag: v1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "10m"      
      memory: "100Mi"   
    limits:
      cpu: "500m"
      memory: "100Mi"
  extraLabels:
    team: shop

postgres:
  instances: 1
  storage:
    size: 1Gi
  priorityClassName: shop-critical
  enablePDB: true
  resources:
    requests:
      cpu: "1"
      memory: "384Mi"   # 189Mi (krr за 30 мин) не хватило: OOMKilled, когда таблица выросла
    limits:
      cpu: "1"
      memory: "384Mi"
  extraLabels:
    team: shop

batch:
  image:
    repository: lab4-batch
    tag: v1
    pullPolicy: IfNotPresent
  replicaCount: 1
  priorityClassName: shop-batch
  nodeSelector:
    kubernetes.io/hostname: lab4-control-plane
  load:
    cpuWorkers: 1
    memMB: 32
    memStepMB: 2
    memStepSeconds: 2
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"  
      memory: "512Mi"
  extraLabels:
    team: analytics

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true
  sla:
    latencySeconds: "0.1"
    latencyTarget: 0.95
    errorRatio: 0.01
  throttleRatio: 0.25

dashboard:
  enabled: true